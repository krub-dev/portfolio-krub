version: 2
# Grouped, so version bumps arrive as one reviewable PR per ecosystem instead of
# one per package. GitHub's Dependabot security updates are a separate thing and
# still open immediately, whatever this schedule says.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor together; a major bump stays on its own so it cannot drag
      # the routine updates down with it when its build is the one that breaks.
      root:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: monthly
    groups:
      scripts:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
