<!doctype html>
<!--
  Default language is English. useLang() rewrites this attribute in step 3 when
  the language is toggled, and honours a saved preference in
  localStorage["krub-lang"] if there is one.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>krub — Fullstack Developer</title>
    <meta
      name="description"
      content="Crafting what you see. Engineering what holds it up. Kiko Rubio — fullstack developer working in Java with Spring Boot, Node and Vue. Barcelona, Murcia, remote."
    />

    <!--
      One page, one address. www.krub.dev already 308s to the apex at the edge,
      so this is belt and braces — but a crawler can also arrive with a tracking
      query string appended, and without this it may treat that as a separate
      page and split the ranking between the two.
    -->
    <link rel="canonical" href="https://krub.dev/" />

    <!--
      The tab icon is SVG: it stays crisp at any size and it is 5 KB. Built
      from the vector logo, on a full-bleed yellow circle so the mark fills 78%
      of the width — a favicon competing with twenty others in a tab strip has
      to read at 16px, and a small mark floating in space disappears.

      The PNG is for iOS, which still does not accept SVG for a home-screen
      icon. It is a square rather than a circle on purpose: iOS applies its own
      rounded-corner mask, and a circle would leave transparent corners.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Tints the browser UI on mobile. Two values so it follows the theme: the
      media query is what makes a phone in light mode not get a black bar.
    -->
    <meta name="theme-color" content="#0C0C0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)" />

    <!--
      Open Graph. Absolute URLs on purpose: the crawlers that read these (Slack,
      WhatsApp, LinkedIn, X) fetch the page out of context and cannot resolve a
      relative path.

      English only. These are baked into the HTML at build time, so they cannot
      follow the language toggle — and English is the default the site ships in.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://krub.dev/" />
    <meta property="og:title" content="krub — Fullstack Developer" />
    <meta
      property="og:description"
      content="Crafting what you see. Engineering what holds it up. Kiko Rubio — fullstack developer working in Java with Spring Boot, Node and Vue. Barcelona, Murcia, remote."
    />
    <meta property="og:image" content="https://krub.dev/assets/img/og-banner.png" />
    <!-- Declaring the size lets a crawler lay out the card before the image
         finishes downloading, so the preview does not reflow. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="krub.dev — Crafting what you see. Engineering what holds it up. Fullstack developer in Barcelona, Murcia and remote."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@krub_dev" />
    <meta name="twitter:creator" content="@krub_dev" />

    <!--
      Structured data. The page says who I am in prose; this says the same thing
      in the vocabulary a search engine actually parses, so that a search for my
      name can resolve to a person rather than to a string of words that happen
      to appear on a page. sameAs is the part that does the work: it ties this
      domain to the profiles that already carry my name elsewhere.

      Kept in sync by hand with src/data/socials.js. It cannot import from it —
      this file is static HTML served before any JavaScript runs, and a crawler
      that does not execute the bundle has to find it here.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kiko Rubio",
        "alternateName": "krub",
        "url": "https://krub.dev/",
        "image": "https://krub.dev/assets/img/krub-pfp.jpeg",
        "jobTitle": "Fullstack Developer",
        "workLocation": [
          { "@type": "Place", "name": "Barcelona, Spain" },
          { "@type": "Place", "name": "Murcia, Spain" }
        ],
        "email": "mailto:krubioillan@gmail.com",
        "knowsLanguage": ["es", "en"],
        "sameAs": [
          "https://github.com/krub-dev",
          "https://linkedin.com/in/krub",
          "https://x.com/krub_dev"
        ]
      }
    </script>

    <!-- Space Grotesk 400/500/600/700 + JetBrains Mono 400/500/700 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Restore the saved theme and language before the page paints.

      This has to be a blocking inline script in <head>, not part of the app:
      the bundle loads as a module, which is deferred, so by the time Vue runs
      the browser has already painted one frame. A visitor who chose light
      would see a dark flash first. Six lines here buy that away.

      main.js reads the same keys and takes over from whatever this leaves.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('krub-theme')
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light')
          var lang = localStorage.getItem('krub-lang')
          if (lang === 'en' || lang === 'es') document.documentElement.setAttribute('lang', lang)
        } catch (e) {
          // Blocked site data. The defaults in the markup already cover this.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
